name: Ralfi Aggregate

on:
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Ralfi aggregate
        run: |
          curl --max-time 70 --fail-with-body \
            "https://agenticlib.com/api/cron/ralfi-aggregate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
