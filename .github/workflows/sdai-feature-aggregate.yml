name: SDAI Feature Aggregate

on:
  schedule:
    - cron: '45 10 * * *'  # 10:45 UTC daily = 20:45 AEST
  workflow_dispatch:
    inputs:
      date:
        description: 'Override scoring date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger SDAI feature aggregate
        run: |
          DATE_PARAM=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_PARAM="?date=${{ github.event.inputs.date }}"
          fi
          curl --max-time 70 --fail-with-body \
            "https://agenticlib.com/api/cron/sdai-feature-aggregate${DATE_PARAM}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
