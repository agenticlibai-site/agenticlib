name: Dexify Feature Collection (GPT)

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dexify feature collection (GPT)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/dexify-feature-collection?model=gpt-4o-mini" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
