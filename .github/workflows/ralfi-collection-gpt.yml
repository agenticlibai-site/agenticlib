name: Ralfi Collection (GPT)

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Ralfi collection (GPT-4o-mini)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/ralfi-collection?model=gpt-4o-mini" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
