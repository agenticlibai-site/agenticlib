name: Ralfi Collection (Claude)

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Ralfi collection (Claude Haiku)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/ralfi-collection?model=claude-haiku-4-5" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
