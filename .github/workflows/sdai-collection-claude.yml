name: SDAI Collection (Claude)

# AI Video Creation competitive intelligence — brand coverage.
# 39 prompts × 3 runs. Fires daily, self-gates if no data yet.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily = 16:00 AEST (UTC+10)
  workflow_dispatch:
    inputs:
      date:
        description: 'Override collection date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger SDAI collection (Claude Haiku)
        run: |
          DATE_PARAM=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_PARAM="&date=${{ github.event.inputs.date }}"
          fi
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/sdai-collection?model=claude-haiku-4-5${DATE_PARAM}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
