name: Ralfi Sentiment Aggregate

# Weekly — runs Sunday 03:00 UTC after a full Mon–Sat collection week.
# Aggregates ralfi_sentiment_responses into ralfi_sentiment_scores
# and writes drift flags to ralfi_sentiment_drift.
# No-ops gracefully if no sentiment responses exist yet.

on:
  schedule:
    - cron: '0 3 * * 0'   # 03:00 UTC Sunday = 13:00 AEST Sunday (UTC+10)
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Ralfi sentiment aggregate
        run: |
          curl --max-time 70 --fail-with-body \
            "https://agenticlib.com/api/cron/ralfi-sentiment-aggregate" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
