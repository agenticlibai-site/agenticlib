name: SDAI Sentiment Collection (Claude)

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily = 19:00 AEST
  workflow_dispatch:
    inputs:
      date:
        description: 'Override collection date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger SDAI sentiment collection (Claude Haiku)
        run: |
          DATE_PARAM=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_PARAM="&date=${{ github.event.inputs.date }}"
          fi
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/sdai-sentiment-collection?model=claude-haiku-4-5${DATE_PARAM}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
