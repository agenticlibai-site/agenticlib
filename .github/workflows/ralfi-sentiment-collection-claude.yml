name: Ralfi Sentiment Collection (Claude)

# Fires daily but self-gates: the route returns a no-op until LOCKED_RALFI_BRANDS
# is populated with verified competitor brands after the Day 2 denylist review.
# No manual day-counting needed — adding brands to LOCKED_RALFI_BRANDS activates it.

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Ralfi sentiment collection (Claude Haiku)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/ralfi-sentiment-collection?model=claude-haiku-4-5" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
