name: Dexify Sentiment Collection (GPT)

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dexify sentiment collection (GPT)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/dexify-sentiment-collection?model=gpt-4o-mini" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
