name: Ralfi Feature Collection (Claude)

# Fires daily but self-gates: the route returns a no-op until LOCKED_RALFI_BRANDS
# is populated with verified competitor brands after the Day 2 denylist review.
# 18 features × brands × 3 runs. Includes grounding pass for low-confidence results.

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC daily = 20:00 AEST (UTC+10)
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Ralfi feature collection (Claude Haiku)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/ralfi-feature-collection?model=claude-haiku-4-5" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
