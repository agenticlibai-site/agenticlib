name: SDAI Feature Collection (Claude)

# 20 features × 12 brands × 3 runs = 720 calls. Includes grounding pass.

on:
  schedule:
    - cron: '0 10 * * *'  # 10:00 UTC daily = 20:00 AEST
  workflow_dispatch:
    inputs:
      date:
        description: 'Override collection date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger SDAI feature collection (Claude Haiku)
        run: |
          DATE_PARAM=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_PARAM="&date=${{ github.event.inputs.date }}"
          fi
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/sdai-feature-collection?model=claude-haiku-4-5${DATE_PARAM}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
