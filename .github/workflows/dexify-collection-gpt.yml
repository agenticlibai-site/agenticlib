name: Dexify Visibility Collection (GPT)

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Dexify visibility collection (GPT)
        run: |
          curl --max-time 310 --fail-with-body \
            "https://agenticlib.com/api/cron/dexify-collection?model=gpt-4o-mini" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
